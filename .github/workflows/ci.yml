name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Speed budget (looser on shared runners; Windows runners are measured locally, their disks are too slow)
        if: runner.os != 'Windows'
        run: npm run test:perf
        env:
          BAGLAM_PERF_BUDGET_MS: "150"
          BAGLAM_HOOK_BUDGET_MS: "600"
      - run: npm run build
      - name: Pack, install and run the packaged CLI
        run: npm run smoke

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - name: Build and check every page (links, both languages, no third-party requests)
        run: npm run build
        working-directory: site
